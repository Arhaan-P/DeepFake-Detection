name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install black ruff

      - name: Check formatting (black)
        run: black --check models/ utils/ scripts/ ieee_scripts/ tests/

      - name: Lint (ruff)
        run: ruff check models/ utils/ scripts/ ieee_scripts/ tests/

      - name: Install CPU-only torch for the smoke test
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run smoke test
        run: python tests/smoke_test.py
